<html lang="id"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_blank" name="shell-type"/><title>AIM-LIS / Perpustakaan Admin</title><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Outfit:wght@600&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>

"1.5rem","space-xs":"0.25rem","margin":"2.5rem"},"fontFamily":{"title-md":["Inter"],"label-md":["Inter"],"headline-sm":["Outfit"],"display-lg":["Outfit"],"body-md":["Inter"],"headline-md":["Outfit"],"label-sm":["Inter"],"body-sm":["Inter"],"headline-lg":["Outfit"],"label-lg":["Inter"],"display-md":["Outfit"],"body-lg":["Inter"]},"fontSize":{"title-md":["16px",{"lineHeight":"24px","fontWeight":"600"}],"label-md":["12px",{"lineHeight":"16px","letterSpacing":"0.04em","fontWeight":"600"}],"headline-sm":["16px",{"lineHeight":"24px","fontWeight":"600"}],"display-lg":["40px",{"lineHeight":"48px","letterSpacing":"-0.02em","fontWeight":"600"}],"body-md":["14px",{"lineHeight":"22px","fontWeight":"400"}],"headline-md":["20px",{"lineHeight":"28px","fontWeight":"600"}],"label-sm":["11px",{"lineHeight":"14px","letterSpacing":"0.05em","fontWeight":"600"}],"body-sm":["13px",{"lineHeight":"18px","fontWeight":"400"}],"headline-lg":["24px",{"lineHeight":"32px","letterSpacing":"-0.01em","fontWeight":"600"}],"label-lg":["14px",{"lineHeight":"20px","letterSpacing":"0.01em","fontWeight":"500"}],"display-md":["32px",{"lineHeight":"40px","letterSpacing":"-0.015em","fontWeight":"600"}],"body-lg":["16px",{"lineHeight":"26px","fontWeight":"400"}]}}}};</script></head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased"><div class="fixed inset-0 pointer-events-none overflow-hidden z-0"><div class="absolute -top-32 -right-32 w-[600px] h-[600px] rounded-full bg-primary-fixed/40 blur-[120px]"></div><div class="absolute -bottom-32 -left-32 w-[560px] h-[560px] rounded-full bg-surface-variant/50 blur-[120px]"></div></div><main class="relative z-10 min-h-screen w-full flex items-center justify-center px-space-md py-space-xl"><div class="flex flex-col w-full items-center justify-center relative">
<div class="w-full max-w-[420px] relative">
<div class="absolute -top-10 -left-10 w-36 h-36 rounded-full bg-primary-fixed/50 blur-2xl pointer-events-none"></div>
<div class="absolute -bottom-10 -right-10 w-40 h-40 rounded-full bg-surface-container-high/70 blur-2xl pointer-events-none"></div>
<div class="relative bg-surface-container-lowest/85 backdrop-blur-xl rounded-lg shadow-xl p-space-xl flex flex-col gap-space-lg">
<div class="flex flex-col items-center text-center gap-space-sm">
<div class="w-14 h-14 rounded-full bg-primary-fixed text-primary flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">balance</span>
</div>
<div class="flex flex-col gap-space-xs">
<h1 class="font-headline-lg text-headline-lg text-on-surface">Perpustakaan Admin</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sistem Informasi Perpustakaan</p>
</div>
</div>
<form class="flex flex-col gap-space-md" id="admin-login-form" onsubmit="handleLogin(event)">
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant pl-space-sm" for="username">Username</label>
<div class="relative flex items-center bg-surface-container-low rounded-full px-space-md h-12 shadow-sm focus-within:bg-surface-container-lowest focus-within:shadow-md transition-all">
<span class="material-symbols-outlined text-outline text-[20px] mr-space-sm">person</span>
<input autocomplete="username" class="w-full bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none" id="username" name="username" placeholder="admin" required="" type="text"/>
</div>
</div>
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant pl-space-sm" for="password">Password</label>
<div class="relative flex items-center bg-surface-container-low rounded-full px-space-md h-12 shadow-sm focus-within:bg-surface-container-lowest focus-within:shadow-md transition-all">
<span class="material-symbols-outlined text-outline text-[20px] mr-space-sm">lock</span>
<input autocomplete="current-password" class="w-full bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Tampilkan kata sandi" class="text-outline hover:text-primary transition-colors flex items-center justify-center ml-space-sm focus:outline-none" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" id="toggle-icon">visibility</span>
</button>
</div>
</div>
<button class="mt-space-sm w-full h-12 rounded-full bg-gradient-to-r from-primary-container to-primary text-on-primary font-label-lg text-label-lg shadow-md hover:shadow-lg hover:scale-[1.01] active:scale-[0.99] transition-all flex items-center justify-center gap-space-sm" id="submit-btn" type="submit">
<span>Masuk</span>
</button>
<p class="font-body-sm text-body-sm text-on-surface-variant text-center px-space-sm">
          Gunakan akun pustakawan untuk mengelola katalog &amp; sirkulasi.
        </p>
</form>
<div class="flex items-center justify-center pt-space-xs">
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors flex items-center gap-space-xs" href="#">
<span>← Kembali ke OPAC</span>
</a>
</div>
</div>
</div>
</div>
<script>
  const toggleBtn = document.getElementById('toggle-password');
  const passwordInput = document.getElementById('password');
  const toggleIcon = document.getElementById('toggle-icon');

  if (toggleBtn && passwordInput && toggleIcon) {
    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      toggleIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
    });
  }

  function handleLogin(event) {
    event.preventDefault();
    const btn = document.getElementById('submit-btn');
    if (!btn) return;
    const originalText = btn.innerHTML;
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span><span>Memproses...</span>';
    btn.disabled = true;
    setTimeout(() => {
      btn.innerHTML = originalText;
      btn.disabled = false;
    }, 1200);
  }
</script></main></body></html>
