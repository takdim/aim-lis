{% extends "admin/_base.html" %}

{% block content %}
<div class="page-header">
  <div>
    <div class="page-title">Mulai Transaksi Sirkulasi</div>
    <div class="page-sub">Cari anggota untuk memulai transaksi peminjaman</div>
  </div>
</div>

<div class="search-bar transaction-search">
  <div class="search-input">
    <span class="icon">🔎</span>
    <input type="text" id="member-search" placeholder="Masukkan NIM/ID anggota..." />
  </div>
  <button class="btn danger" id="finish-btn" type="button">Selesai Transaksi</button>
</div>

<div class="transaction-grid hidden" id="transaction-panel">
  <div class="transaction-left">
    <div class="panel">
      <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center;">
        <div class="panel-title">Detail Keanggotaan</div>
        <button class="btn danger" id="trigger-fine-btn" type="button" style="padding: 4px 10px; font-size: 12px;">+ Kena Denda</button>
      </div>
      <div class="panel-body detail-grid" id="member-detail"></div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">Peminjaman</div>
      </div>
      <div class="panel-body">
        <div class="borrow-bar">
          <input type="text" id="item-code" placeholder="Masukkan kode eksemplar..." />
          <button class="btn primary" id="borrow-btn" type="button">Pinjam</button>
        </div>
        <div class="hint" id="borrow-hint"></div>
      </div>
    </div>
  </div>

  <div class="transaction-right">
    <div class="panel">
      <div class="panel-header tabs">
        <button class="tab active" data-tab="current">Pinjaman Saat Ini (<span id="current-count">0</span>)</button>
        <button class="tab" data-tab="fine">Denda</button>
        <button class="tab" data-tab="history">Sejarah</button>
      </div>
      <div class="panel-body">
        <div class="tab-content" id="tab-current"></div>
        <div class="tab-content hidden" id="tab-fine"></div>
        <div class="tab-content hidden" id="tab-history"></div>
      </div>
    </div>
  </div>
</div>

<div class="empty-state" id="empty-state">
  <div class="empty-title">Masukkan NIM/ID anggota untuk mulai transaksi</div>
</div>

<!-- Modal Tambah Denda -->
<div class="modal" id="fine-modal" aria-hidden="true">
  <div class="modal-card" style="max-width: 480px;">
    <div class="modal-header">
      <div>
        <div class="modal-title">Tandai Denda Anggota</div>
        <div class="modal-sub" id="fine-modal-sub">-</div>
      </div>
      <button class="btn ghost" type="button" id="close-fine-modal">Tutup</button>
    </div>
    <div class="modal-body">
      <div style="display: flex; flex-direction: column; gap: 14px;">
        <label class="field">
          <span>Nominal Denda (Rp) *</span>
          <input type="number" id="fine-amount-input" min="1" step="500" placeholder="Contoh: 5000" />
        </label>
        <label class="field">
          <span>Keterangan / Alasan Denda</span>
          <input type="text" id="fine-desc-input" placeholder="Contoh: Keterlambatan / Buku rusak / Ganti barcode" />
        </label>
        <div class="hint danger" id="fine-error-hint" style="color: #ef4444; font-size: 13px; display: none;"></div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" type="button" id="cancel-fine-modal">Batal</button>
      <button class="btn danger" type="button" id="submit-fine-modal">Simpan Denda</button>
    </div>
  </div>
</div>

<!-- Modal Konfirmasi (Perpanjang & Kembali) -->
<div class="modal" id="confirm-modal" aria-hidden="true">
  <div class="modal-card" style="max-width: 480px;">
    <div class="modal-header">
      <div class="modal-title" id="confirm-modal-title">Konfirmasi</div>
      <button class="btn ghost" type="button" id="close-confirm-modal">Tutup</button>
    </div>
    <div class="modal-body" id="confirm-modal-body">
      <!-- Diisi secara dinamis -->
    </div>
    <div class="modal-actions">
      <button class="btn ghost" type="button" id="cancel-confirm-modal">Batal</button>
      <button class="btn primary" type="button" id="proceed-confirm-modal">Lanjutkan</button>
    </div>
  </div>
</div>

<script>
  const memberInput = document.getElementById("member-search");
  const transactionPanel = document.getElementById("transaction-panel");
  const emptyState = document.getElementById("empty-state");
  const memberDetail = document.getElementById("member-detail");
  const borrowBtn = document.getElementById("borrow-btn");
  const itemCodeInput = document.getElementById("item-code");
  const borrowHint = document.getElementById("borrow-hint");
  const currentCount = document.getElementById("current-count");
  const tabCurrent = document.getElementById("tab-current");
  const tabFine = document.getElementById("tab-fine");
  const tabHistory = document.getElementById("tab-history");
  const finishBtn = document.getElementById("finish-btn");

  // Fine Modal Elements
  const fineModal = document.getElementById("fine-modal");
  const fineModalSub = document.getElementById("fine-modal-sub");
  const fineAmountInput = document.getElementById("fine-amount-input");
  const fineDescInput = document.getElementById("fine-desc-input");
  const fineErrorHint = document.getElementById("fine-error-hint");
  const closeFineModal = document.getElementById("close-fine-modal");
  const cancelFineModal = document.getElementById("cancel-fine-modal");
  const submitFineModal = document.getElementById("submit-fine-modal");
  const triggerFineBtn = document.getElementById("trigger-fine-btn");

  // Confirm Modal Elements
  const confirmModal = document.getElementById("confirm-modal");
  const confirmModalTitle = document.getElementById("confirm-modal-title");
  const confirmModalBody = document.getElementById("confirm-modal-body");
  const closeConfirmModal = document.getElementById("close-confirm-modal");
  const cancelConfirmModal = document.getElementById("cancel-confirm-modal");
  const proceedConfirmModal = document.getElementById("proceed-confirm-modal");

  let activeMember = null;
  let currentLoans = [];
  let pendingAction = null;

  function escapeHtml(str) {
    if (!str) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function openModal(modalEl) {
    modalEl.setAttribute("aria-hidden", "false");
    modalEl.classList.add("show");
  }

  function closeModal(modalEl) {
    modalEl.setAttribute("aria-hidden", "true");
    modalEl.classList.remove("show");
  }

  function renderDetail(member) {
    const rows = [
      ["Nama Anggota", member.member_name],
      ["Email", member.member_email || "-"],
      ["ID Anggota", member.member_id],
      ["Tipe Keanggotaan", member.member_type_name || "-"],
      ["Tanggal Registrasi", member.register_date || "-"],
      ["Berlaku Hingga", member.expire_date || "-"],
    ];
    memberDetail.innerHTML = rows
      .map(
        ([label, value]) => `
          <div class="detail-row">
            <div class="detail-label">${escapeHtml(label)}</div>
            <div class="detail-value">${escapeHtml(value)}</div>
          </div>`
      )
      .join("");
  }

  function renderCurrent(loans) {
    currentLoans = loans || [];
    currentCount.textContent = currentLoans.length;
    if (!currentLoans.length) {
      tabCurrent.innerHTML = '<div class="empty-mini">Belum ada pinjaman aktif.</div>';
      return;
    }
    tabCurrent.innerHTML = currentLoans
      .map(
        (loan) => `
        <div class="loan-card">
          <div>
            <div class="loan-title">${escapeHtml(loan.title)}</div>
            <div class="loan-meta">${escapeHtml(loan.item_code)}</div>
            <div class="loan-meta">Pinjam: ${loan.loan_date} · Kembali: ${loan.due_date}</div>
            ${
              loan.fine_amount && loan.fine_amount > 0
                ? `<div class="loan-meta danger">Denda: Rp ${Number(loan.fine_amount).toLocaleString("id-ID")}</div>`
                : ""
            }
          </div>
          <div class="loan-actions">
            ${loan.can_renew ? `<button class="btn ghost" data-renew="${loan.loan_id}">Perpanjang</button>` : ""}
            <button class="btn ghost" data-return="${loan.loan_id}">Kembalikan</button>
          </div>
        </div>`
      )
      .join("");
  }

  function renderFines(fines) {
    const totalAmount = Number(fines.total || 0);
    const hasItems = fines.items && fines.items.length > 0;
    const headerHtml = `
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; flex-wrap: wrap;">
        <div class="fine-total" style="margin-bottom: 0;">Total Denda: Rp ${totalAmount.toLocaleString("id-ID")}</div>
        <button class="btn danger" id="tab-add-fine-btn" type="button" style="padding: 6px 12px; font-size: 13px;">+ Tambah Denda</button>
      </div>
    `;

    if (!hasItems) {
      tabFine.innerHTML = headerHtml + '<div class="empty-mini">Tidak ada denda.</div>';
      return;
    }
    const items = fines.items
      .map(
        (fine) => `
        <div class="loan-card">
          <div>
            <div class="loan-title">${escapeHtml(fine.title || "Denda")}</div>
            <div class="loan-meta">${escapeHtml(fine.item_code || "-")}</div>
            <div class="loan-meta">${
              fine.days_late !== null && fine.days_late !== undefined
                ? `Terlambat ${fine.days_late} hari · Rp ${Number(fine.amount).toLocaleString("id-ID")}`
                : `Denda · Rp ${Number(fine.amount).toLocaleString("id-ID")}`
            }</div>
          </div>
        </div>`
      )
      .join("");
    tabFine.innerHTML = headerHtml + items;
  }

  function renderHistory(history) {
    if (!history.length) {
      tabHistory.innerHTML = '<div class="empty-mini">Belum ada riwayat peminjaman.</div>';
      return;
    }
    tabHistory.innerHTML = history
      .map(
        (loan) => `
        <div class="loan-card">
          <div>
            <div class="loan-title">${escapeHtml(loan.title)}</div>
            <div class="loan-meta">${escapeHtml(loan.item_code)}</div>
            <div class="loan-meta">Pinjam: ${loan.loan_date} · Kembali: ${loan.return_date || '-'} </div>
          </div>
          <div class="badge ${loan.status}">${escapeHtml(loan.status_label)}</div>
        </div>`
      )
      .join("");
  }

  function setActiveTab(name) {
    document.querySelectorAll(".tab").forEach((tab) => {
      tab.classList.toggle("active", tab.dataset.tab === name);
    });
    tabCurrent.classList.toggle("hidden", name !== "current");
    tabFine.classList.toggle("hidden", name !== "fine");
    tabHistory.classList.toggle("hidden", name !== "history");
  }

  async function loadMember() {
    const memberId = memberInput.value.trim();
    if (!memberId) return;

    const res = await fetch("/admin/transaksi/member", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ member_id: memberId }),
    });
    const data = await res.json();
    if (!data.ok) {
      alert(data.error || "Anggota tidak ditemukan.");
      return;
    }
    activeMember = data.member;
    renderDetail(data.member);
    renderCurrent(data.current);
    renderFines(data.fines);
    renderHistory(data.history);
    transactionPanel.classList.remove("hidden");
    emptyState.classList.add("hidden");
    setActiveTab("current");
  }

  async function borrowItem() {
    const itemCode = itemCodeInput.value.trim();
    if (!itemCode || !activeMember) return;
    borrowHint.textContent = "";

    const res = await fetch("/admin/transaksi/loan", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ member_id: activeMember.member_id, item_code: itemCode }),
    });
    const data = await res.json();
    if (!data.ok) {
      borrowHint.textContent = data.error || "Gagal meminjam.";
      return;
    }
    itemCodeInput.value = "";
    renderCurrent(data.current);
    renderFines(data.fines);
    renderHistory(data.history);
    setActiveTab("current");
  }

  // Konfirmasi Pengembalian
  function askConfirmReturn(loanId) {
    const loan = currentLoans.find((l) => String(l.loan_id) === String(loanId));
    const title = loan ? loan.title : "Buku ini";
    const code = loan ? loan.item_code : "-";
    const loanDate = loan ? loan.loan_date : "-";
    const dueDate = loan ? loan.due_date : "-";
    const fineNotice = (loan && loan.fine_amount > 0)
      ? `<div style="margin-top: 12px; padding: 10px 14px; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.25); border-radius: 8px; color: #ef4444; font-size: 13px;">
          <strong>Perhatian:</strong> Peminjaman ini memiliki denda keterlambatan sebesar <strong>Rp ${Number(loan.fine_amount).toLocaleString("id-ID")}</strong>.
        </div>`
      : "";

    confirmModalTitle.textContent = "Konfirmasi Pengembalian";
    confirmModalBody.innerHTML = `
      <p style="margin-bottom: 12px; font-size: 14px; color: var(--text);">Apakah Anda yakin ingin memproses <strong>pengembalian</strong> untuk eksemplar berikut?</p>
      <div style="background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px;">
        <div style="font-weight: 600; font-size: 14px; color: var(--text);">${escapeHtml(title)}</div>
        <div style="font-size: 13px; color: var(--muted); margin-top: 4px;">Kode Eksemplar: <code>${escapeHtml(code)}</code></div>
        <div style="font-size: 13px; color: var(--muted); margin-top: 2px;">Tgl Pinjam: ${loanDate} · Jatuh Tempo: ${dueDate}</div>
      </div>
      ${fineNotice}
    `;
    proceedConfirmModal.textContent = "Ya, Kembalikan";
    proceedConfirmModal.className = "btn primary";
    pendingAction = () => returnItem(loanId);
    openModal(confirmModal);
  }

  async function returnItem(loanId) {
    const res = await fetch("/admin/transaksi/return", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ loan_id: loanId }),
    });
    const data = await res.json();
    if (!data.ok) {
      alert(data.error || "Gagal mengembalikan.");
      return;
    }
    renderCurrent(data.current);
    renderFines(data.fines);
    renderHistory(data.history);
  }

  // Konfirmasi Perpanjang
  function askConfirmRenew(loanId) {
    const loan = currentLoans.find((l) => String(l.loan_id) === String(loanId));
    const title = loan ? loan.title : "Buku ini";
    const code = loan ? loan.item_code : "-";
    const dueDate = loan ? loan.due_date : "-";

    confirmModalTitle.textContent = "Konfirmasi Perpanjangan";
    confirmModalBody.innerHTML = `
      <p style="margin-bottom: 12px; font-size: 14px; color: var(--text);">Apakah Anda yakin ingin <strong>memperpanjang</strong> masa peminjaman eksemplar berikut?</p>
      <div style="background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px;">
        <div style="font-weight: 600; font-size: 14px; color: var(--text);">${escapeHtml(title)}</div>
        <div style="font-size: 13px; color: var(--muted); margin-top: 4px;">Kode Eksemplar: <code>${escapeHtml(code)}</code></div>
        <div style="font-size: 13px; color: var(--muted); margin-top: 2px;">Jatuh Tempo Saat Ini: ${dueDate}</div>
      </div>
    `;
    proceedConfirmModal.textContent = "Ya, Perpanjang";
    proceedConfirmModal.className = "btn primary";
    pendingAction = () => renewItem(loanId);
    openModal(confirmModal);
  }

  async function renewItem(loanId) {
    const res = await fetch("/admin/transaksi/renew", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ loan_id: loanId }),
    });
    const data = await res.json();
    if (!data.ok) {
      alert(data.error || "Gagal perpanjang.");
      return;
    }
    renderCurrent(data.current);
    renderHistory(data.history);
    renderFines(data.fines);
  }

  // Denda Anggota
  function openFineModal() {
    if (!activeMember) {
      alert("Pilih/cari anggota terlebih dahulu.");
      return;
    }
    fineModalSub.textContent = `Anggota: ${activeMember.member_name} (${activeMember.member_id})`;
    fineAmountInput.value = "";
    fineDescInput.value = "";
    fineErrorHint.style.display = "none";
    fineErrorHint.textContent = "";
    openModal(fineModal);
    setTimeout(() => fineAmountInput.focus(), 100);
  }

  async function submitFine() {
    if (!activeMember) return;
    const amountVal = fineAmountInput.value.trim();
    const descVal = fineDescInput.value.trim();
    fineErrorHint.style.display = "none";
    fineErrorHint.textContent = "";

    const amount = parseInt(amountVal, 10);
    if (!amount || amount <= 0) {
      fineErrorHint.textContent = "Nominal denda harus berupa angka lebih dari 0.";
      fineErrorHint.style.display = "block";
      fineAmountInput.focus();
      return;
    }

    const res = await fetch("/admin/transaksi/fine", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        member_id: activeMember.member_id,
        amount: amount,
        description: descVal || "Denda",
      }),
    });
    const data = await res.json();
    if (!data.ok) {
      fineErrorHint.textContent = data.error || "Gagal menambahkan denda.";
      fineErrorHint.style.display = "block";
      return;
    }
    closeModal(fineModal);
    renderCurrent(data.current);
    renderFines(data.fines);
    renderHistory(data.history);
    setActiveTab("fine");
  }

  // Event Listeners
  memberInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      event.preventDefault();
      loadMember();
    }
  });

  borrowBtn.addEventListener("click", borrowItem);
  itemCodeInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      event.preventDefault();
      borrowItem();
    }
  });

  if (finishBtn) {
    finishBtn.addEventListener("click", () => {
      if (!activeMember) return;
      if (!confirm("Selesaikan transaksi untuk anggota saat ini?")) return;
      activeMember = null;
      currentLoans = [];
      memberInput.value = "";
      itemCodeInput.value = "";
      transactionPanel.classList.add("hidden");
      emptyState.classList.remove("hidden");
    });
  }

  // Trigger Denda Buttons
  if (triggerFineBtn) {
    triggerFineBtn.addEventListener("click", openFineModal);
  }

  // Fine Modal Actions
  closeFineModal.addEventListener("click", () => closeModal(fineModal));
  cancelFineModal.addEventListener("click", () => closeModal(fineModal));
  submitFineModal.addEventListener("click", submitFine);
  fineAmountInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      submitFine();
    }
  });
  fineDescInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      submitFine();
    }
  });

  // Confirm Modal Actions
  closeConfirmModal.addEventListener("click", () => {
    closeModal(confirmModal);
    pendingAction = null;
  });
  cancelConfirmModal.addEventListener("click", () => {
    closeModal(confirmModal);
    pendingAction = null;
  });
  proceedConfirmModal.addEventListener("click", () => {
    if (pendingAction) {
      const act = pendingAction;
      pendingAction = null;
      closeModal(confirmModal);
      act();
    }
  });

  // Delegated clicks for Tabs, Return, Renew, and Tab Add Fine
  document.addEventListener("click", (event) => {
    const tabBtn = event.target.closest(".tab");
    if (tabBtn) {
      setActiveTab(tabBtn.dataset.tab);
    }
    const returnBtn = event.target.closest("[data-return]");
    if (returnBtn) {
      askConfirmReturn(returnBtn.dataset.return);
    }
    const renewBtn = event.target.closest("[data-renew]");
    if (renewBtn) {
      askConfirmRenew(renewBtn.dataset.renew);
    }
    const tabAddFineBtn = event.target.closest("#tab-add-fine-btn");
    if (tabAddFineBtn) {
      openFineModal();
    }
  });
</script>
{% endblock %}
