<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login — AIM-LIS Perpustakaan Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}" />
  </head>
  <body class="login-body">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-icon">
          <span class="material-symbols-outlined" style="font-size: 28px;">balance</span>
        </div>
        <div>
          <div class="brand-title">Perpustakaan Admin</div>
          <div class="brand-sub">Sistem Informasi Perpustakaan</div>
        </div>
      </div>

      {% if message %}
      <div class="alert">{{ message }}</div>
      {% endif %}

      <form class="login-form" method="post">
        <label>
          <span>Username</span>
          <div class="login-input-wrap">
            <span class="material-symbols-outlined">person</span>
            <input type="text" name="username" placeholder="admin" autocomplete="username" required />
          </div>
        </label>
        <label>
          <span>Password</span>
          <div class="login-input-wrap">
            <span class="material-symbols-outlined">lock</span>
            <input type="password" id="login-password" name="password" placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" class="pw-toggle" id="toggle-pw" aria-label="Tampilkan password">
              <span class="material-symbols-outlined" id="toggle-pw-icon">visibility</span>
            </button>
          </div>
        </label>
        <button class="btn primary full" type="submit" style="height: 46px; margin-top: 4px;">Masuk</button>
        <div class="login-help">Gunakan akun pustakawan untuk mengelola katalog &amp; sirkulasi.</div>
      </form>

      <div class="login-back">
        <a href="{{ url_for('main.opac_home') }}">← Kembali ke OPAC</a>
      </div>
    </div>

    <script>
      const pwToggle = document.getElementById("toggle-pw");
      const pwInput = document.getElementById("login-password");
      const pwIcon = document.getElementById("toggle-pw-icon");
      if (pwToggle && pwInput && pwIcon) {
        pwToggle.addEventListener("click", () => {
          const isPassword = pwInput.type === "password";
          pwInput.type = isPassword ? "text" : "password";
          pwIcon.textContent = isPassword ? "visibility_off" : "visibility";
        });
      }
    </script>
  </body>
</html>
